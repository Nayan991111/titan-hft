    .hot { fill: #1c2a3d; stroke: #3987e5; }
    .wire { stroke: #9a998f; } .tip { fill: #9a998f; }
    .bracket { stroke: #3987e5; }
    .tile { fill: #242422; } .big { fill: #f0efec; } .accent { fill: #3987e5; }
    .none { fill: #57564f; } .chip { fill: #1f1f1e; stroke: #46453f; }
