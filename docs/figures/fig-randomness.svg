<text class="t3" x="74" y="410" font-size="11">Both rates agree the effect has gone by p99.9 and the far tail. The peak grows and moves earlier as utilisation</text>
<text class="t3" x="74" y="425" font-size="11">rises toward the measured ceiling, which is what a coincidence-queue account predicts. That account is untested.</text>
