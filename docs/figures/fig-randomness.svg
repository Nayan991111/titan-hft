<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-labelledby="rt rd">
<title id="rt">Cost of random arrivals against a perfectly periodic schedule</title>
<desc id="rd">7,000,000 msg/s, spin peaks at 3.44 times at the 98.12nd percentile, 30 of 30 launches; 5,000,000 msg/s, spin peaks at 2.78 times at the 99.55nd percentile, 27 of 30 launches; 7,000,000 msg/s, isb peaks at 3.19 times at the 98.47nd percentile, 30 of 30 launches; 5,000,000 msg/s, isb peaks at 2.75 times at the 99.64nd percentile, 29 of 30 launches; 7,000,000 msg/s, wfe peaks at 3.22 times at the 98.47nd percentile, 30 of 30 launches; 5,000,000 msg/s, wfe peaks at 2.54 times at the 99.55nd percentile, 28 of 30 launches</desc>
