<text class="t1" x="74" y="24" font-size="16" font-weight="500">A random arrival schedule costs up to 3.4 times a periodic one at the same mean rate</text>
<text class="t3" x="74" y="42" font-size="12">Latency ratio, random (Poisson) over perfectly periodic, paired within 30 independent launches. Higher is worse for random.</text>
