[package]
name = "titan-itch"
version = "0.1.0"
edition = "2021"
description = "NASDAQ TotalView-ITCH 5.0 decoder, zero-allocation L3 order book, reference book and synthetic feed generator"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
titan-platform = { path = "../titan-platform" }
titan-spsc = { path = "../titan-spsc" }

[[bin]]
name = "titan-replay"
path = "src/bin/titan-replay.rs"

[[bin]]
name = "titan-t2t"
path = "src/bin/titan-t2t.rs"

[[bin]]
name = "titan-pipeline"
path = "src/bin/titan-pipeline.rs"

[[bin]]
name = "titan-fanout"
path = "src/bin/titan-fanout.rs"

[[bin]]
name = "titan-agg"
path = "src/bin/titan-agg.rs"

[[bin]]
name = "titan-wire"
path = "src/bin/titan-wire.rs"

[[bin]]
name = "titan-arb"
path = "src/bin/titan-arb.rs"
